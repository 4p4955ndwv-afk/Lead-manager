# Deploys the Lead Manager web app to Cloudflare Workers (free plan, *.workers.dev) on every push.
# Needs the repository secret CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers"). The token is tied to one
# account, so wrangler finds the account itself. Without the secret the job builds the app and skips the deploy.
name: Deploy web app

on:
  push:
    branches: [main, claude/sharp-dirac-wxy7di]
    paths: ['apps/web/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Skip deploy when Cloudflare secrets are missing
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Built OK. Add the CLOUDFLARE_API_TOKEN repository secret to deploy."
      - name: Make sure the account has a workers.dev name
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          api=https://api.cloudflare.com/client/v4
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          acct=$(curl -fsS -H "$auth" "$api/accounts?per_page=5" | jq -r '.result[0].id')
          echo "::add-mask::$acct"
          echo "CLOUDFLARE_ACCOUNT_ID=$acct" >> "$GITHUB_ENV"
          current=$(curl -sS -H "$auth" "$api/accounts/$acct/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -n "$current" ]; then echo "workers.dev name already set: $current"; exit 0; fi
          for name in "lead-manager-$RANDOM" "lead-manager-$RANDOM$RANDOM"; do
            res=$(curl -sS -X PUT -H "$auth" -H 'Content-Type: application/json' --data "{\"subdomain\":\"$name\"}" "$api/accounts/$acct/workers/subdomain")
            if echo "$res" | jq -e '.success' >/dev/null; then echo "Registered $name.workers.dev"; exit 0; fi
            echo "Could not register $name: $(echo "$res" | jq -c '.errors')"
          done
          echo "::error::Could not register a workers.dev name. Open Workers & Pages in the Cloudflare dashboard once and pick one."
          exit 1
      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "LIVE_URL=$url" >> "$GITHUB_ENV"
          echo "::notice title=Live site::${url:-deployed (see log for the address)}"
          echo "### Live site: ${url:-see the deploy log}" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the live site loads
        if: env.LIVE_URL != ''
        run: |
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$LIVE_URL/" || true)
            if [ "$code" = "200" ] && curl -s "$LIVE_URL/" | grep -q '<title>Lead Manager</title>'; then echo "Live and serving the app: $LIVE_URL"; exit 0; fi
            echo "Attempt $i: HTTP $code (a new workers.dev name can take a few minutes to go live)"; sleep 10
          done
          echo "::warning::Deployed, but $LIVE_URL did not answer yet. A new workers.dev name can take a few more minutes."
